name: CodeQL

# Code scanning on pushes to main, weekly and by hand, not on every PR push,
# using the family's shared workflow. GitHub's default setup can't be narrowed
# that way, so it stays off here.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    uses: stevehill1981/198x-workflows/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      languages: '["actions", "python", "rust"]'
