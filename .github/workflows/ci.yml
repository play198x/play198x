name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        # rust-toolchain.toml is the single source of truth. dtolnay's action
        # no longer auto-reads it, so extract the channel and pass it on.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Check formatting
        run: scripts/check format

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: scripts/check lint-workspace

  # Cross-platform test: the crate decodes bytes and renders audio to fixed
  # numbers, and the tests assert those numbers, so they must run on every host
  # rather than Linux alone — a platform drift would otherwise slip through.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Test workspace
        run: bash scripts/check test-workspace

  # `play198x-web` is excluded from the workspace (see the root Cargo.toml), so
  # none of the jobs above ever build, test, or lint it. Without this job the
  # shell has no CI at all.
  shell:
    name: Shell (wasm-bindgen)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/play198x-web -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # A plain `cargo test` on this crate builds for the host target and
      # silently runs zero tests: `#[wasm_bindgen_test]` only registers with
      # the `wasm-bindgen-test-runner` harness, which needs the wasm32 target.
      # `wasm-pack test` wires both up, so this is the form that actually
      # executes `tests/boundary.rs` rather than reporting a false green.
      # The shell crate is excluded from the workspace, so it carries its OWN
      # Cargo.lock — and nothing updates it when a workspace dependency moves.
      # Measured 2026-08-27: the ADF fix from #7 reached play198x-core and did
      # not reach here, leaving the published browser decoder still reporting
      # ordinary Amiga data disks as corrupt. Both crates built, every test
      # passed, and the only sign was a dirty lockfile after a local build.
      - name: The shell's lockfile must not lag its dependencies
        run: scripts/check lockfile

      - name: Test the shell
        run: scripts/check test-shell

      - name: Clippy the shell
        run: scripts/check lint-shell

      # Both targets are built so the browser target cannot rot: it has no
      # consumer yet, and nothing else would notice it breaking.
      - name: Build both shell targets
        run: scripts/check build-shell
