name: Release-plz

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

# Opening the release PR needs the org/repo setting "Allow GitHub Actions to
# create and approve pull requests" enabled (Settings -> Actions -> General).
# id-token is what lets release-plz publish to crates.io over Trusted
# Publishing — no stored registry token.
#
# The release PR itself is pushed with RELEASE_PLZ_TOKEN when that secret
# exists, and GITHUB_TOKEN otherwise. This is not cosmetic: a branch pushed by
# GITHUB_TOKEN does not trigger workflows, so under GITHUB_TOKEN alone the
# release PR gets **no CI at all** — the one change in this repository that
# publishes to crates.io would be the only one merged unverified. Measured
# 2026-08-27: on the v0.1.1 release branch the only workflow runs were on
# commits pushed by a human; release-plz's own commit had none. build198x, whose
# org does hold the secret, gets a run on every release-plz commit.
permissions:
  pull-requests: write
  contents: write
  id-token: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # release-plz needs full history to diff the changelog from the last
          # tag.
          fetch-depth: 0
          # Pushing the release branch with this token is what lets CI run on
          # the release PR; see the note above. Falls back to GITHUB_TOKEN, so
          # this is inert rather than broken until the play198x org has its own
          # fine-grained PAT (one per org — never shared between them).
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Open/update the "chore: release" PR for new commits.
      - name: Run release-plz (open/update release PR)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # Once a release PR is merged, tag the crate and publish it. publish = true
      # in release-plz.toml, so release-plz runs cargo publish itself, exchanging
      # the id-token above for a crates.io Trusted Publishing token. Pairing that
      # with crates-io-auth-action and a CARGO_REGISTRY_TOKEN is what release-plz
      # documents *not* to do, so there is no separate auth or publish step here.
      - name: Run release-plz (tag and publish merged releases)
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # Announce the release in Discord. Every crate released in this run goes
      # into a single message rather than one post per crate: versioning here is
      # per-package, so a normal cycle releases several at once and a post each
      # would bury the channel.
      #
      # Reads DISCORD_RELEASE_WEBHOOK (org-level secret). Absent, the step logs
      # and succeeds — a missing notification must not fail a release that has
      # already published to crates.io.
      - name: Announce the release in Discord
        if: steps.release.outputs.releases_created == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          WEBHOOK_ALL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_ALL }}
          RELEASES: ${{ steps.release.outputs.releases }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Post to this project's own channel and, when set, an aggregate
          # channel carrying every repo. Built with `if` rather than
          # `[ -n "$x" ] && arr+=(...)`: under `set -e` a failing test at the end
          # of a command list exits the step, so the shorter form would abort
          # whenever a secret is unset — the normal case this tolerates.
          targets=()
          if [ -n "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK")
          fi
          # Skip an aggregate pointed at the same channel, so a single-channel
          # setup that fills both secrets does not post twice.
          if [ -n "${WEBHOOK_ALL}" ] && [ "${WEBHOOK_ALL}" != "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK_ALL")
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "::notice::no Discord webhook secret set — nothing posted."
            exit 0
          fi

          count=$(jq 'length' <<<"$RELEASES")
          if [ "$count" = "0" ]; then
            echo "::notice::no releases in this run — nothing posted."
            exit 0
          fi

          # One embed field per crate, each linking to its own GitHub Release.
          # Built with jq throughout so crate names and versions are escaped
          # rather than pasted into a hand-written JSON string.
          jq -n \
            --argjson releases "$RELEASES" \
            --arg repo "$REPO" \
            --arg base "${SERVER_URL}/${REPO}/releases/tag" \
            --arg title "$( [ "$count" = "1" ] && echo "play198x — 1 crate released" || echo "play198x — ${count} crates released" )" \
            '{
               username: "198x releases",
               embeds: [{
                 title: $title,
                 url: ($base + "/" + ($releases[0].tag // ($releases[0].package_name + "-v" + $releases[0].version))),
                 color: 3066993,
                 fields: ($releases | map({
                   name: (.package_name + " v" + .version),
                   value: ("[release notes](" + $base + "/" + (.tag // (.package_name + "-v" + .version)) + ") · [crates.io](https://crates.io/crates/" + .package_name + "/" + .version + ")"),
                   inline: false
                 })),
                 footer: { text: $repo }
               }]
             }' > payload.json

          # Every target is attempted even if an earlier one fails, so a stale
          # aggregate URL cannot hide a successful post to the project channel.
          failed=0
          for target in "${targets[@]}"; do
            if ! curl --silent --show-error --fail-with-body \
                      --retry 3 --retry-delay 5 --retry-all-errors \
                      -H "Content-Type: application/json" \
                      -X POST -d @payload.json "$target"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::at least one Discord post failed; see the output above."
            exit 1
          fi

          echo "Announced ${count} crate(s) to Discord."
