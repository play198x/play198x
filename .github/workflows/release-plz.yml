name: Release-plz

# Tags merged releases, then opens or updates the next release PR, using the
# workflow every 198x Rust repo shares (stevehill1981/198x-workflows).
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # crates.io Trusted Publishing matches this file's name, so keep it.
  id-token: write

jobs:
  release-plz:
    name: Release-plz
    uses: stevehill1981/198x-workflows/.github/workflows/release-plz.yml@v1
    # Named, not `inherit`: GitHub passes inherited secrets only within one
    # organisation or enterprise, and the shared workflow is in a personal
    # account. A secret this org lacks is passed empty.
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_RELEASE_WEBHOOK_ALL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_ALL }}
    with:
      announce: true
      # crates/play198x-web sits outside the workspace with its own lockfile,
      # which pins play198x-core; release-plz never updates it, so the release
      # PR would fail ci.yml's `cargo fetch --locked`. `-p`, not a bare update,
      # so no unreviewed dependency bump rides along with the release.
      release-branch-command: cargo update -p play198x-core --manifest-path crates/play198x-web/Cargo.toml
      release-branch-commit-message: "chore(web): point the shell's lockfile at the released version"
