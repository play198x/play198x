[package]
name = "play198x-core"
# Published and independently versioned from the first release. Siblings are
# told to consume this (studio198x-authoring.md clause 4), and a crate marked
# publish = false cannot be consumed from another org — the trap recorded as
# emu198x/emu198x#1214. Stated explicitly rather than left to cargo default,
# so that inverting it has to be a deliberate edit rather than an omission.
publish = true
version = "0.1.0"
description = "Open, identify and render retro media — Spectrum, C64 and Amiga images, and ProTracker modules."
keywords = ["retro", "amiga", "protracker", "c64", "spectrum"]
categories = ["multimedia", "emulators"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Each dependency arrives with the task that first uses it — the ADF and
# PowerPacker crates with disk images, `mediaspec198x` and the image crates with
# decoding — so the manifest never claims a dependency the code does not need.
[dependencies]
# ZIP container reading and, in the tests, writing. Default features are off
# deliberately: zip's defaults pull AES, bzip2, LZMA, PPMd, zstd, XZ and
# Deflate64, none of which an archive of retro media uses. DEFLATE is the one
# method real archives of this material are stored with.
#
# `deflate-flate2-zlib-rs` rather than the `deflate` umbrella, which also pulls
# `deflate-zopfli`. Zopfli is a best-compression *writer*; this crate only
# reads, and the test writer asks for `CompressionMethod::Deflated`, which
# flate2 handles. Naming the one backend drops `zopfli`, `bumpalo` and `log`
# from every consumer's graph.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

# Amiga disk images. 0.2.3 specifically: it is the release that tells a
# non-DOS disk apart from a damaged one, and names the containers (IPF, DMS,
# and the like) that are Amiga media but not raw sector images. Earlier
# releases fold both into "corrupt", which is the mistake this task exists to
# avoid making downstream.
format198x-commodore-amiga-adf = "0.3.0"
# PowerPacked files decrunch on the way out of `read`, whatever container they
# arrived in, so the dependency belongs to the container layer rather than the
# decoders.
format198x-commodore-amiga-powerpacker = "0.1.1"

# Palettes and screen geometry for the fixed-palette machines. The Format198x
# image crates expose palette *indices* and deliberately stop there: RGBA needs
# a palette, palettes belong here under `198x/decisions/shared-media-spec.md`,
# and a Format198x crate cannot depend on this one without breaking the
# dependency-free rule that is the reason Format198x exists. So the conversion
# lives in `decode`, and this is where it gets its colours — and its pixel
# aspects, which are just as much spec data as the colours are.
mediaspec198x = "0.1.0"

# The decoders `probe` identifies for and `decode` dispatches to. `probe` needs
# them for their exported constants alone — `LOAD_ADDRESS`, `FILE_LEN`,
# `MIN_FILE_LEN`, `is_module` — which is why they arrive with this task rather
# than with decoding: repeating 0x6000 or 10003 here would let the two copies
# drift apart with nothing to notice.
format198x-commodore-amiga-mod = "0.1.1"
format198x-commodore-amiga-ilbm = "0.1.1"
format198x-commodore-c64-koala = "0.1.1"
format198x-commodore-c64-art-studio = "0.1.1"
format198x-sinclair-zx-spectrum-scr = "0.1.1"

[lints]
workspace = true
