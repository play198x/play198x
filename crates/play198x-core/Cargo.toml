[package]
name = "play198x-core"
# Published and independently versioned from the first release. Siblings are
# told to consume this (studio198x-authoring.md clause 4), and a crate marked
# publish = false cannot be consumed from another org — the trap recorded as
# emu198x/emu198x#1214. Stated explicitly rather than left to cargo default,
# so that inverting it has to be a deliberate edit rather than an omission.
publish = true
version = "0.1.0"
description = "Open, identify and render retro media — Spectrum, C64 and Amiga images, and ProTracker modules."
keywords = ["retro", "amiga", "protracker", "c64", "spectrum"]
categories = ["multimedia", "emulators"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Each dependency arrives with the task that first uses it — the ADF and
# PowerPacker crates with disk images, `mediaspec198x` and the image crates with
# decoding — so the manifest never claims a dependency the code does not need.
[dependencies]
# ZIP container reading and, in the tests, writing. Default features are off
# deliberately: zip's defaults pull AES, bzip2, LZMA, PPMd, zstd, XZ and
# Deflate64, none of which an archive of retro media uses. DEFLATE is the one
# method real archives of this material are stored with.
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true
