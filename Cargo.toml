# play198x — the 198x family's retro media player/viewer.
#
# One published library crate today: `play198x-core`, which opens a retro media
# file from any of three container shapes, identifies it from its bytes, and
# yields either an RGBA image or a ProTracker module that plays. The shells
# (GPUI and wasm-bindgen) are a later plan and are deliberately absent.
[workspace]
resolver = "3"
members = ["crates/play198x-core"]

[workspace.package]
edition = "2024"
# The MSRV is the toolchain this workspace is actually built and tested with
# (`rust-toolchain.toml`, and CI). Declaring anything lower would assert a floor
# nothing ever compiles against — and an unverified claim is worse than none.
rust-version = "1.98"
license = "GPL-2.0-or-later"
repository = "https://github.com/play198x/play198x"

[workspace.lints.rust]
# `deny` here, and `#![forbid(unsafe_code)]` at the top of `src/lib.rs`. The
# published code is still forbidden outright — but a workspace-level `forbid`
# also covers the test binaries, and `forbid` is the one level an inner
# `#![allow]` cannot lift. That makes the allocation test impossible to write:
# proving `render` allocates nothing needs a counting `GlobalAlloc`, which is
# an unsafe trait. Denying here and forbidding in the library is the same
# guarantee for everything that ships, and it matches how `unwrap_used` already
# works in this workspace: denied globally, allowed per test binary.
unsafe_code = "deny"
unused_must_use = "deny"

# `unwrap_used` and `expect_used` are denied because a panic reachable from a
# container, probe or decode path is undefined behaviour once the FFI surface
# arrives. Tests opt out with an inner
# `#![allow(clippy::unwrap_used, clippy::expect_used)]`.
[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
